<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>डिजिटल बधाई कार्ड - लिंक शेयरिंग</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        /* पूरी वेबसाइट पर आतिशबाज़ी का बैकग्राउंड */
        body { 
            font-family: 'Arial', sans-serif; 
            background: #000; 
            margin: 0; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: white;
            overflow-x: hidden;
        }

        /* आतिशबाज़ी एनीमेशन */
        .fireworks {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: move 3s linear infinite;
        }
        @keyframes move {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(-100px); opacity: 0; }
        }

        /* बधाई कार्ड */
        #badhaiCard {
            width: 100%;
            max-width: 450px;
            min-height: 450px;
            border-radius: 20px;
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
            background-size: cover;
            background-position: center;
            border: 6px solid #ffd700;
            box-sizing: border-box;
            margin-bottom: 20px;
            position: relative;
        }

        #cardTitle { font-size: 2.5rem; color: #ffd700; text-shadow: 3px 3px 10px #000; margin: 5px; }
        #previewPhoto { width: 140px; height: 140px; border-radius: 50%; border: 4px solid white; object-fit: cover; margin: 15px 0; display: none; box-shadow: 0 0 15px white; }
        #cardMessage { font-size: 1.5rem; font-weight: bold; text-shadow: 2px 2px 8px #000; line-height: 1.4; }
        .from-tag { font-size: 1.2rem; background: rgba(255, 215, 0, 0.9); color: #000; padding: 6px 20px; border-radius: 30px; font-weight: bold; margin-top: 15px; }

        /* बटन एरिया */
        .btn-group { display: none; flex-direction: column; gap: 12px; width: 100%; max-width: 400px; margin-bottom: 30px; }
        .btn { padding: 15px; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; text-align: center; border: none; color: white; text-decoration: none; display: flex; align-items: center; justify-content: center; }
        .btn-wa { background: #25D366; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4); }
        .btn-dl { background: #3498db; box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4); }

        /* फॉर्म एरिया */
        .form-area {
            background: #fff;
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            color: #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 { font-size: 1.6rem; color: #d81b60; text-align: center; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #555; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        .create-btn { background: #d81b60; color: white; width: 100%; border: none; padding: 16px; border-radius: 10px; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 20px; }

        .footer { margin: 20px; font-size: 14px; color: #777; }
        .make-own { color: #ffd700; text-decoration: underline; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="fireworks"></div>

    <!-- 1. बधाई कार्ड (सबसे ऊपर) -->
    <div id="badhaiCard">
        <h2 id="cardTitle">शादी मुबारक</h2>
        <img id="previewPhoto" src="" alt="Photo">
        <p id="cardMessage"></p>
        <div class="from-tag">प्रेषक: <span id="senderName"></span></div>
    </div>

    <!-- बटन ग्रुप -->
    <div class="btn-group" id="btnGroup">
        <button class="btn btn-wa" onclick="shareOnWhatsApp()">वॉट्सऐप पर लिंक शेयर करें 📱</button>
        <button class="btn btn-dl" onclick="downloadCard()">कार्ड डाउनलोड करें (गैलरी में) ⬇️</button>
    </div>

    <!-- 2. फॉर्म (सबसे नीचे) -->
    <div class="form-area" id="formArea">
        <h1>✨ बधाई कार्ड मेकर</h1>
        
        <label>आपका नाम (बधाई देने वाला):</label>
        <input type="text" id="userInput" placeholder="अपना नाम लिखें">
        
        <label>दोस्त का नाम (बधाई लेने वाला):</label>
        <input type="text" id="friendInput" placeholder="दोस्त का नाम लिखें">

        <label>दोस्त की फोटो चुनें (सिर्फ डाउनलोड के लिए):</label>
        <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
        
        <label>अवसर चुनें:</label>
        <select id="occasionSelect">
            <option value="shadi">शादी मुबारक (Fireworks Special)</option>
            <option value="bday">जन्मदिन (Birthday)</option>
            <option value="anni">सालगिरह (Anniversary)</option>
            <option value="job">नई नौकरी (Job)</option>
            <option value="success">सफलता (Success)</option>
        </select>
        
        <button class="create-btn" onclick="buildCard()">कार्ड तैयार करें</button>
    </div>

    <div class="footer" id="footerText">डिजिटल बधाई ऐप</div>

    <script>
        const contentData = {
            'shadi': { img: 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=600', msg: 'शादी की बहुत-बहुत बधाई! भगवान आपकी जोड़ी सदा बनाए रखे।', title: 'शादी मुबारक' },
            'bday': { img: 'https://images.unsplash.com/photo-1513151233558-d860c5398176?w=600', msg: 'जन्मदिन की हार्दिक शुभकामनाएँ! खुशियाँ आपके कदम चूमे।', title: 'जन्मदिन बधाई' },
            'anni': { img: 'https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?w=600', msg: 'सालगिरह मुबारक हो! आप दोनों हमेशा खुश रहें।', title: 'सालगिरह मुबारक' },
            'job': { img: 'https://images.unsplash.com/photo-1486312338219-ce68d2c6f44d?w=600', msg: 'नई नौकरी की बहुत बधाई! आप जीवन में बहुत तरक्की करें।', title: 'नई नौकरी बधाई' },
            'success': { img: 'https://images.unsplash.com/photo-1517048676732-d65bc937f952?w=600', msg: 'आपकी शानदार सफलता पर हमें गर्व है! बहुत बधाई।', title: 'बधाई हो' }
        };

        // फोटो प्रीव्यू
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const img = document.getElementById('previewPhoto');
                img.src = reader.result;
                img.style.display = "block";
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        // कार्ड बनाना
        function buildCard() {
            const from = document.getElementById('userInput').value;
            const to = document.getElementById('friendInput').value;
            const occ = document.getElementById('occasionSelect').value;

            if(!from || !to) { alert("कृपया नाम लिखें!"); return; }

            showCard(from, to, occ);
            document.getElementById('btnGroup').style.display = "flex";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showCard(from, to, occ) {
            const card = document.getElementById('badhaiCard');
            const data = contentData[occ];

            document.getElementById('cardTitle').innerText = data.title;
            document.getElementById('cardMessage').innerText = "प्रिय " + to + ", " + data.msg;
            document.getElementById('senderName').innerText = from;
            
            card.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('${data.img}')`;
            card.style.display = "flex";
        }

        // डाउनलोड फंक्शन
        function downloadCard() {
            const card = document.getElementById('badhaiCard');
            html2canvas(card, { useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Mera_Badhai_Card.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }

        // **फिक्स्ड वॉट्सऐप शेयर फंक्शन**
        function shareOnWhatsApp() {
            const from = document.getElementById('userInput').value || "शुभचिंतक";
            const to = document.getElementById('friendInput').value || "दोस्त";
            const occ = document.getElementById('occasionSelect').value;

            // वर्तमान वेबसाइट का लिंक निकालना
            const currentUrl = window.location.href.split('?')[0];

            // शेयर करने वाला लिंक बनाना
            const shareLink = `${currentUrl}?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&occ=${occ}`;

            const message = `*बधाई संदेश!* 🎉%0A%0Aप्रिय *${to}*, आपके लिए एक खास सरप्राइज है। नीचे दिए गए लिंक पर क्लिक करके देखें:%0A%0A${shareLink}`;
            
            window.open(`https://wa.me/?text=${message}`, '_blank');
        }

        // लिंक से डेटा पढ़ना
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('from')) {
                showCard(urlParams.get('from'), urlParams.get('to'), urlParams.get('occ'));
                document.getElementById('footerText').innerHTML = '<span class="make-own" onclick="location.href=location.pathname">अपना खुद का कार्ड बनाने के लिए यहाँ क्लिक करें</span>';
            }
        };
    </script>
</body>
</html>
